<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Artist booking website workflow</title>
  <desc id="desc">A visitor discovers the artist, submits a booking request, and the request is validated before being stored locally or in Supabase and optionally sent by email.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17142b"/>
      <stop offset="1" stop-color="#30244d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#f5b97b"/>
      <stop offset="1" stop-color="#ef8fa8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#090713" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="7" refY="4">
      <path d="M0 0 8 4 0 8Z" fill="#d8ccef"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <circle cx="1060" cy="55" r="145" fill="#8c6dde" opacity=".12"/>
  <circle cx="90" cy="410" r="170" fill="#ee8fa8" opacity=".08"/>
  <text x="68" y="70" fill="#fff8f2" font-family="Arial, sans-serif" font-size="28" font-weight="700">From discovery to booking</text>
  <text x="68" y="101" fill="#cfc4e6" font-family="Arial, sans-serif" font-size="16">A small, focused MVP with a clear path to production.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="68" y="160" width="220" height="160" rx="18" fill="#fff8f2"/>
    <circle cx="104" cy="198" r="20" fill="#f5b97b"/>
    <text x="104" y="204" text-anchor="middle" fill="#17142b" font-size="16" font-weight="700">1</text>
    <text x="92" y="245" fill="#17142b" font-size="19" font-weight="700">Discover</text>
    <text x="92" y="273" fill="#5b5269" font-size="14">Home · About · Gallery</text>
    <text x="92" y="295" fill="#5b5269" font-size="14">Videos · Services</text>

    <rect x="346" y="160" width="220" height="160" rx="18" fill="#fff8f2"/>
    <circle cx="382" cy="198" r="20" fill="#ef8fa8"/>
    <text x="382" y="204" text-anchor="middle" fill="#17142b" font-size="16" font-weight="700">2</text>
    <text x="370" y="245" fill="#17142b" font-size="19" font-weight="700">Request</text>
    <text x="370" y="273" fill="#5b5269" font-size="14">Event details and contact</text>
    <text x="370" y="295" fill="#5b5269" font-size="14">Booking form with clear states</text>

    <rect x="624" y="160" width="220" height="160" rx="18" fill="#fff8f2"/>
    <circle cx="660" cy="198" r="20" fill="#9dd8c0"/>
    <text x="660" y="204" text-anchor="middle" fill="#17142b" font-size="16" font-weight="700">3</text>
    <text x="648" y="245" fill="#17142b" font-size="19" font-weight="700">Validate</text>
    <text x="648" y="273" fill="#5b5269" font-size="14">Zod validation and</text>
    <text x="648" y="295" fill="#5b5269" font-size="14">spam protection hooks</text>

    <rect x="902" y="160" width="220" height="160" rx="18" fill="#fff8f2"/>
    <circle cx="938" cy="198" r="20" fill="#b9a7ee"/>
    <text x="938" y="204" text-anchor="middle" fill="#17142b" font-size="16" font-weight="700">4</text>
    <text x="926" y="245" fill="#17142b" font-size="19" font-weight="700">Route</text>
    <text x="926" y="273" fill="#5b5269" font-size="14">Supabase when configured</text>
    <text x="926" y="295" fill="#5b5269" font-size="14">Local fallback + email hook</text>
  </g>

  <g stroke="#d8ccef" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M290 240h45"/>
    <path d="M568 240h45"/>
    <path d="M846 240h45"/>
  </g>
  <rect x="68" y="365" width="1054" height="2" fill="url(#accent)" opacity=".7"/>
  <text x="68" y="397" fill="#d8ccef" font-family="Arial, sans-serif" font-size="14">Current state: local MVP complete</text>
  <text x="1122" y="397" text-anchor="end" fill="#d8ccef" font-family="Arial, sans-serif" font-size="14">Next: credentials · content · launch</text>
</svg>
